[tool.pyright]
include = ["scripts", "typings", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
stubPath = "typings"
extraPaths = [".devenv/profile/lib/python3.14/site-packages"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --numprocesses=4 --dist=loadfile --tracing=retain-on-failure --screenshot=only-on-failure"
filterwarnings = ["error"]
